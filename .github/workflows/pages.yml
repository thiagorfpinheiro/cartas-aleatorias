# Compila o núcleo C++ para WebAssembly e publica o app web no GitHub Pages.
name: Publicar app web

on:
  push:
    branches: [main]
    paths:
      - "Core/**"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Testar núcleo C++
        run: |
          g++ -std=c++20 -ICore Core/CartasCore.cpp Testes/teste_core.cpp -o teste_core
          ./teste_core
      - name: Compilar site
        run: sh web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
